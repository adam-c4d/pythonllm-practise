# Rebuild the learning environment on any computer (full steps: SETUP.md):
#   conda env create -f environment.yml      # first time
#   conda env update -n dsllm -f environment.yml   # after this file changes
#   conda activate dsllm
name: dsllm
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5
  - pandas=3.1
  - matplotlib=3.11
  - seaborn=0.13
  - scikit-learn=1.9
  - jupyter
  - ipykernel
  - pip
  - pip:
      # PyTorch, CPU-only build (Task 7). About 200 MB.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.15.*
      - fastapi[standard]
      - python-dotenv
      - openai          # LLM client, used with Ollama (Phase 5)
      - pytest          # tests (Task 8 onwards)
