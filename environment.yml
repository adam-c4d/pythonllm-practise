# Rebuild the learning environment on any computer:
#   conda env create -f environment.yml
#   conda activate dsllm
name: dsllm
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5
  - pandas=3.1
  - matplotlib=3.11
  - seaborn=0.13
  - scikit-learn=1.9
  - jupyter
  - ipykernel
  - pip
  - pip:
      - fastapi[standard]
      - python-dotenv
